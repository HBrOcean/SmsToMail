name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VER: '8.9'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK and Gradle
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK"
          SM=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1)
          echo "sdkmanager=$SM"
          if [ -z "$SM" ]; then echo "::error::sdkmanager not found"; exit 1; fi
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          ok=""
          for u in \
            "https://mirrors.cloud.tencent.com/gradle/gradle-${GRADLE_VER}-bin.zip" \
            "https://mirrors.huaweicloud.com/gradle/gradle-${GRADLE_VER}-bin.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" ; do
            echo "::group::download $u"
            if curl -fsSL --retry 3 --retry-delay 3 --max-time 300 -o /tmp/gradle.zip "$u" \
               && unzip -q -o /tmp/gradle.zip -d /opt ; then
              echo "OK: $u"
              ok="yes"
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
          done
          if [ -z "$ok" ]; then echo "::error::Gradle 下载失败"; exit 1; fi
          echo "/opt/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"
          /opt/gradle-${GRADLE_VER}/bin/gradle --version

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsToMail-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
